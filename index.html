
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1535">
  <title>نبض الطالب</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1535;
      color: white;
      min-height: 100vh;
    }
    header {
      padding: 24px 18px;
      background: #111f49;
      border-bottom: 1px solid #263963;
    }
    header h1 { margin: 0 0 8px; color: #62e6e0; }
    header p { margin: 0; color: #c4cee8; }
    main { padding: 20px; max-width: 700px; margin: auto; }
    .welcome {
      padding: 22px;
      background: #14234b;
      border-radius: 18px;
      margin-bottom: 20px;
    }
    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .tool {
      padding: 20px 12px;
      background: #14234b;
      border: 1px solid #2b3d69;
      border-radius: 14px;
      color: white;
      text-align: center;
      font-size: 16px;
    }
    .tool span { display: block; font-size: 28px; margin-bottom: 10px; }
    footer { text-align: center; padding: 25px; color: #aebcdb; }
  </style>
</head>
<body>
  <header>
    <h1>💙 نبض الطالب</h1>
    <p>خطوة كل يوم تقرّبك من حلمك</p>
  </header>
  <main>
    <section class="welcome">
      <h2>أهلًا بيك في رحلتك للنجاح! 🎓</h2>
      <p>نظّم وقتك، تابع مذاكرتك، وقرّب من هدفك كل يوم.</p>
    </section>
    <h2>أدواتك الدراسية</h2>
    <section class="tools">
      <div class="tool"><span>📚</span>خطة المذاكرة</div>
      <div class="tool"><span>⏱️</span>مؤقت التركيز</div>
      <div class="tool"><span>✅</span>مهامي اليومية</div>
      <div class="tool"><span>🧠</span>المراجعة الذكية</div>
    </section>
  </main>
  <footer>نبض الطالب · طريقك نحو التفوق</footer>
</body>
</html>
